[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qualys-qid-vulnerabilities"
version = "0.1.0"
description = "Qualys host vulnerability detection lookup and explicitly confirmed QID ignore tool."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[project.scripts]
qid = "qualys_qid_vulnerabilities.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
